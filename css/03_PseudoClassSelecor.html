<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a:link{
            color: rgb(6, 93, 93);
        }
        a:visited{
            color: royalblue;
        }
        h1:active{
            background-color: lightblue;
            user-select: none;
        }
        button:hover{
            background-color: black;
            color: white;
            cursor: pointer;
        }

        ul>li:first-child{
            background-color: orange;
        }
        ul>li:last-child{
            background-color: green;
        }
        ul>li:nth-child(2){
            background-color: blue;
        }
        section>h3:first-of-type{
            background-color: blueviolet;
        }
         section>h3:nth-last-of-type(2){
            background-color: hotpink;
        }
        section>h3:last-of-type{
            background-color: royalblue;
        }
        
    </style>
</head>
<body>
    <h1>Learn Pseudo Class Selector</h1>
    <a href="https://www.flipkart.com">Fipkart</a>
    <a href="https://www.zara.com">Zara</a>
    <a href="./task1.html">Demo</a>
    <button>Submit</button>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ul>
    <section>
        <article>I am Article</article>
        <h3>I am H3</h3>
        <aside>I am aside</aside>
        <h3>I am H3</h3>
        <article>I am Article</article>
        <h3>I am H3</h3>
        <aside>I am aside</aside>
    </section>
</body>
</html>
